<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f2;--surface:#fff;--surface2:#f0ede6;
  --text:#1a1a18;--text2:#6b6b67;--text3:#a0a09a;
  --border:rgba(0,0,0,.10);--border2:rgba(0,0,0,.18);
  --radius:10px;--radius-sm:6px;
  --font:'Segoe UI',system-ui,sans-serif;--blue:#185FA5;
  --bottom-nav:60px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#181816;--surface:#222220;--surface2:#2a2a28;
  --text:#f0ede6;--text2:#9a9a94;--text3:#5a5a56;
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16)
}}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);background:var(--bg);color:var(--text)}

/* SCREENS */
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* LOADING / LOGIN */
.center-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:1.5rem}
.center-box{background:var(--surface);border:.5px solid var(--border2);border-radius:var(--radius);
  padding:2rem 1.5rem;width:100%;max-width:360px;text-align:center}
.center-box h1{font-size:20px;font-weight:500;margin-bottom:.3rem}
.center-box p{font-size:13px;color:var(--text2);margin-bottom:1.25rem;line-height:1.5}
.icon{font-size:44px;margin-bottom:.75rem}
.spinner{width:30px;height:30px;border:2px solid var(--border2);border-top-color:var(--blue);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOP BAR */
.topbar{background:var(--surface);border-bottom:.5px solid var(--border);
  padding:0 1rem;display:flex;align-items:center;gap:8px;height:52px;flex-shrink:0;
  position:relative;z-index:10}
.topbar h1{font-size:15px;font-weight:500;flex:1}
.topbar-btn{background:none;border:none;cursor:pointer;color:var(--text2);
  padding:8px;border-radius:var(--radius-sm);font-size:22px;line-height:1;display:flex;align-items:center}
.topbar-btn:hover{background:var(--surface2)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;transition:background .3s;flex-shrink:0}
.sync-dot.live{background:#4CAF50}

/* WEEK NAV BAR */
.week-nav{background:var(--surface);border-bottom:.5px solid var(--border);
  padding:8px 1rem;display:flex;align-items:center;gap:8px;flex-shrink:0}
.week-nav-btn{background:none;border:.5px solid var(--border2);border-radius:var(--radius-sm);
  padding:6px 12px;font-size:13px;cursor:pointer;color:var(--text);font-family:var(--font)}
.week-nav-btn:hover{background:var(--surface2)}
.week-nav-btn.today{background:var(--blue);color:#fff;border-color:var(--blue)}
.week-label{flex:1;text-align:center;font-size:13px;font-weight:500}

/* DAY STRIP (mobile week overview) */
.day-strip{display:flex;background:var(--surface);border-bottom:.5px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-pill{flex:1;min-width:44px;padding:8px 4px;text-align:center;cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.day-pill.active{border-bottom-color:var(--blue)}
.day-pill-name{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.day-pill-num{font-size:17px;font-weight:500;margin-top:2px;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;margin:2px auto 0;border-radius:50%}
.day-pill-num.today-num{background:var(--blue);color:#fff}
.day-pill.active .day-pill-num:not(.today-num){background:var(--surface2)}
.day-dot-row{display:flex;justify-content:center;gap:2px;margin-top:3px;min-height:6px}
.day-dot{width:5px;height:5px;border-radius:50%}

/* CALENDAR SCROLL AREA */
.cal-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* DAY VIEW */
.day-view{display:flex;flex-direction:column}
.hour-row{display:flex;align-items:stretch;min-height:52px;border-bottom:.5px solid var(--border)}
.hour-label{width:48px;flex-shrink:0;font-size:11px;color:var(--text3);
  padding:4px 6px 0;text-align:right}
.hour-col{flex:1;position:relative;cursor:pointer;transition:background .1s}
.hour-col:hover{background:var(--surface2)}
.ev-block{position:absolute;left:4px;right:4px;border-radius:6px;
  padding:3px 7px;font-size:12px;font-weight:500;color:#fff;
  overflow:hidden;cursor:pointer;z-index:2;line-height:1.3}
.ev-block:hover{opacity:.85}
.ev-block-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev-block-person{font-size:10px;opacity:.85}

/* WEEK VIEW (desktop) */
.week-view{display:none}
@media(min-width:600px){
  .day-strip{display:none}
  .day-view{display:none}
  .week-view{display:block}
  .week-nav .week-label{font-size:14px}
}
.week-grid{display:grid;grid-template-columns:48px repeat(7,1fr);min-width:100%}
.wg-corner{background:var(--surface2);border-bottom:.5px solid var(--border);border-right:.5px solid var(--border)}
.wg-dayhdr{background:var(--surface2);border-bottom:.5px solid var(--border);
  border-right:.5px solid var(--border);padding:6px 4px;text-align:center}
.wg-dayhdr:last-child{border-right:none}
.wg-dname{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.wg-dnum{font-size:16px;font-weight:500;margin-top:1px}
.wg-dnum-today{background:var(--blue);color:#fff;border-radius:50%;
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin:1px auto 0;font-size:13px}
.wg-tlabel{font-size:10px;color:var(--text3);padding:3px 4px 0;height:44px;
  display:flex;align-items:flex-start;justify-content:flex-end;
  border-bottom:.5px solid var(--border);border-right:.5px solid var(--border)}
.wg-hcell{height:44px;border-bottom:.5px solid var(--border);border-right:.5px solid var(--border);
  cursor:pointer;position:relative;transition:background .1s}
.wg-hcell:hover{background:var(--surface2)}
.wg-eblock{position:absolute;left:1px;right:1px;border-radius:4px;
  padding:2px 4px;font-size:10px;font-weight:500;color:#fff;overflow:hidden;z-index:2;line-height:1.3;cursor:pointer}
.wg-eblock:hover{opacity:.82}
.wg-etitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg-eperson{font-size:9px;opacity:.85}

/* BOTTOM NAV */
.bottom-nav{height:var(--bottom-nav);background:var(--surface);border-top:.5px solid var(--border);
  display:flex;flex-shrink:0}
.bottom-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;background:none;border:none;color:var(--text3);font-family:var(--font);
  font-size:10px;transition:color .15s;padding:0}
.bottom-nav-btn.active{color:var(--blue)}
.bottom-nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media(min-width:600px){.bottom-nav{display:none}}

/* SIDEBAR DRAWER */
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;display:none}
.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:280px;background:var(--surface);
  z-index:101;transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;overflow-y:auto}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:1rem;border-bottom:.5px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.drawer-header h2{font-size:15px;font-weight:500}
.drawer-close{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text2)}
.drawer-body{padding:1rem;flex:1}
.drawer-section{margin-bottom:1.5rem}
.drawer-section h3{font-size:11px;font-weight:500;color:var(--text2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.member-chip{display:flex;align-items:center;gap:8px;padding:8px;
  border-radius:var(--radius-sm);cursor:pointer;transition:background .1s}
.member-chip:hover{background:var(--surface2)}
.member-chip.inactive{opacity:.4}
.mdot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.mname{font-size:14px;flex:1}
.mdel{background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;
  padding:0 2px;line-height:1}
.mdel:hover{color:#A32D2D}
.add-row{display:flex;gap:8px;margin-top:8px}
.add-row input{flex:1}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.swatch:hover{opacity:.8}
.swatch.sel{border-color:var(--text)}

/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
@media(min-width:600px){.modal-overlay{align-items:center}}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;
  padding:1.25rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
@media(min-width:600px){.modal{border-radius:var(--radius)}}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;
  margin:0 auto 1rem}
@media(min-width:600px){.modal-handle{display:none}}
.modal h2{font-size:15px;font-weight:500;margin-bottom:1rem;
  display:flex;justify-content:space-between;align-items:center}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)}
.time-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mactions{display:flex;gap:8px;justify-content:space-between;
  margin-top:1rem;padding-top:1rem;border-top:.5px solid var(--border)}

/* FAB */
.fab{position:fixed;right:1rem;bottom:calc(var(--bottom-nav) + 1rem);
  width:52px;height:52px;border-radius:50%;background:var(--blue);color:#fff;
  border:none;cursor:pointer;font-size:26px;display:flex;align-items:center;
  justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.2);z-index:50;
  transition:transform .15s}
.fab:hover{transform:scale(1.07)}
@media(min-width:600px){.fab{display:none}}

/* SHARED INPUTS */
input,select,textarea,button{font-family:var(--font);font-size:14px;color:var(--text);
  background:var(--surface2);border:.5px solid var(--border2);border-radius:var(--radius-sm);
  padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.15)}
button{cursor:pointer;background:var(--surface);transition:background .1s,transform .1s}
button:hover{background:var(--surface2)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
button.primary:hover{background:#0C447C}
button.danger{background:#FCEBEB;color:#791F1F;border-color:#F09595}
textarea{width:100%;min-height:60px;resize:vertical}
.field{margin-bottom:10px}
.field label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%}
.msg{font-size:13px;min-height:18px;margin:6px 0}
.msg.err{color:#A32D2D}
.msg.ok{color:#3B6D11}
</style>
</head>

<script>
const PALETTE    = ['#E05A5A','#E07B2A','#D4AC0D','#4CAF50','#2196F3','#9C27B0','#00BCD4','#FF5BA3','#3B8F5A','#5C6BC0'];
const DAYS_SHORT = ['Sön','Mån','Tis','Ons','Tor','Fre','Lör'];
const DAYS_LONG  = ['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'];
const MONTHS     = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'];
const HOURS      = Array.from({length:24},(_,i)=>i);
const DEFAULT_PW = 'familj123';
const isMobile   = () => window.innerWidth < 600;

let db, dbRef;
let members = [], events = {}, nextMemberId = 1;
let localPw = DEFAULT_PW;
let selectedColor = PALETTE[0];
let editingEvId = null;
let currentWeekStart = getMonday(new Date());
let selectedDate = isoDate(new Date());
let activeMembers = new Set();
let currentTab = 'cal';

/* SCREENS */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* FIREBASE */
function initFirebase() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db    = firebase.database();
    dbRef = db.ref('familjekalender');

    const timeout = setTimeout(() => {
      localPw = DEFAULT_PW; members = []; events = {};
      showScreen('screen-login');
    }, 8000);

    db.ref('.info/connected').on('value', snap => {
      const dot = document.getElementById('sync-dot');
      if (dot) dot.classList.toggle('live', !!snap.val());
    });

    dbRef.once('value').then(snap => {
      clearTimeout(timeout);
      const d = snap.val();
      if (!d) {
        const seed = ['Mamma','Pappa','Ella','Noah'].map((n,i)=>({id:i+1,name:n,color:PALETTE[i]}));
        nextMemberId = seed.length + 1;
        dbRef.set({ members:seed, events:{}, password:DEFAULT_PW, nextMemberId }).then(() => {
          members = seed; localPw = DEFAULT_PW;
          activeMembers = new Set(members.map(m=>m.id));
          showScreen('screen-login');
          startListener();
        });
      } else {
        members = d.members||[]; events = d.events||{};
        nextMemberId = d.nextMemberId||members.length+1;
        localPw = d.password||DEFAULT_PW;
        activeMembers = new Set(members.map(m=>m.id));
        showScreen('screen-login');
        startListener();
      }
    }).catch(err => {
      clearTimeout(timeout);
      document.getElementById('error-msg').textContent = 'Fel: ' + err.message;
      showScreen('screen-error');
    });
  } catch(e) {
    document.getElementById('error-msg').textContent = 'Konfigurationsfel: ' + e.message;
    showScreen('screen-error');
  }
}

function startListener() {
  dbRef.on('value', snap => {
    const d = snap.val(); if(!d) return;
    members = d.members||[]; events = d.events||{};
    nextMemberId = d.nextMemberId||members.length+1;
    localPw = d.password||DEFAULT_PW;
    if (document.getElementById('screen-app').classList.contains('active')) renderAll();
  });
}
function push(obj) { if(dbRef) dbRef.update(obj); }

/* AUTH */
function tryLogin() {
  if (document.getElementById('pw-input').value === localPw) {
    showScreen('screen-app');
    document.getElementById('pw-input').value = '';
    document.getElementById('login-err').textContent = '';
    activeMembers = new Set(members.map(m=>m.id));
    renderAll();
  } else {
    document.getElementById('login-err').textContent = 'Fel lösenord – försök igen.';
  }
}
function logout() { closeDrawer(); showScreen('screen-login'); }

/* PASSWORD */
function savePw() {
  const p1=document.getElementById('new-pw').value;
  const p2=document.getElementById('new-pw2').value;
  const el=document.getElementById('pw-msg');
  el.className='msg err';
  if(!p1){el.textContent='Ange ett lösenord.';return;}
  if(p1!==p2){el.textContent='Lösenorden matchar inte.';return;}
  if(p1.length<4){el.textContent='Minst 4 tecken.';return;}
  push({password:p1}); localPw=p1;
  el.className='msg ok'; el.textContent='✓ Sparat!';
  document.getElementById('new-pw').value=document.getElementById('new-pw2').value='';
  setTimeout(()=>{el.textContent='';},2500);
}

/* DRAWER */
function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
  renderDrawer();
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

/* TABS */
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.bottom-nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+tab).classList.add('active');
  if (tab==='cal') { openDrawer(); closeDrawer(); renderAll(); }
  else if (tab==='people') openDrawer();
  else if (tab==='settings') openDrawer();
}

/* MEMBERS */
function addMember() {
  const name=document.getElementById('new-name').value.trim(); if(!name) return;
  const used=members.map(m=>m.color);
  const color=PALETTE.find(c=>!used.includes(c))||selectedColor;
  const id=nextMemberId++;
  members.push({id,name,color}); activeMembers.add(id);
  document.getElementById('new-name').value='';
  push({members,nextMemberId});
}
function deleteMember(id) {
  if(!confirm('Ta bort person och alla deras händelser?')) return;
  members=members.filter(m=>m.id!==id); activeMembers.delete(id);
  Object.keys(events).forEach(k=>{if(events[k].memberId===id)delete events[k];});
  push({members,events,nextMemberId});
}
function toggleMember(id) {
  activeMembers.has(id)?activeMembers.delete(id):activeMembers.add(id);
  renderAll();
}

/* DATE HELPERS */
function getMonday(d) {
  const dt=new Date(d),day=dt.getDay();
  dt.setDate(dt.getDate()+(day===0?-6:1-day)); dt.setHours(0,0,0,0); return dt;
}
function isoDate(d) { return d.toISOString().slice(0,10); }
function isToday(d) { return isoDate(d)===isoDate(new Date()); }
function weekDays() {
  return Array.from({length:7},(_,i)=>{const d=new Date(currentWeekStart);d.setDate(d.getDate()+i);return d;});
}

/* NAV */
function prevPeriod() {
  if(isMobile()){
    const d=new Date(selectedDate); d.setDate(d.getDate()-1); selectedDate=isoDate(d);
    currentWeekStart=getMonday(d);
  } else {
    currentWeekStart.setDate(currentWeekStart.getDate()-7);
  }
  renderAll();
}
function nextPeriod() {
  if(isMobile()){
    const d=new Date(selectedDate); d.setDate(d.getDate()+1); selectedDate=isoDate(d);
    currentWeekStart=getMonday(d);
  } else {
    currentWeekStart.setDate(currentWeekStart.getDate()+7);
  }
  renderAll();
}
function goToday() {
  selectedDate=isoDate(new Date());
  currentWeekStart=getMonday(new Date());
  renderAll();
}

/* RENDER ALL */
function renderAll() {
  if(isMobile()) {
    renderDayStrip();
    renderDayView();
    // Update week label to show selected day
    const d=new Date(selectedDate);
    document.getElementById('week-label').textContent =
      `${DAYS_LONG[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  } else {
    document.getElementById('day-strip').style.display='none';
    renderWeekView();
    const days=weekDays(), first=days[0], last=days[6];
    document.getElementById('week-label').textContent =
      `${first.getDate()} ${MONTHS[first.getMonth()]} – ${last.getDate()} ${MONTHS[last.getMonth()]} ${last.getFullYear()}`;
  }
  renderDrawer();
}

/* DAY STRIP */
function renderDayStrip() {
  const strip=document.getElementById('day-strip');
  strip.style.display='flex';
  const days=weekDays();
  strip.innerHTML=days.map(d=>{
    const ds=isoDate(d);
    const dayEvents=Object.values(events).filter(e=>e.date===ds&&activeMembers.has(e.memberId));
    const dots=dayEvents.slice(0,4).map(e=>{
      const m=members.find(x=>x.id===e.memberId);
      return m?`<span class="day-dot" style="background:${m.color}"></span>`:'';
    }).join('');
    const active=ds===selectedDate?'active':'';
    const todayCls=isToday(d)?'today-num':'';
    return `<div class="day-pill ${active}" onclick="selectDay('${ds}')">
      <div class="day-pill-name">${DAYS_SHORT[d.getDay()]}</div>
      <div class="day-pill-num ${todayCls}">${d.getDate()}</div>
      <div class="day-dot-row">${dots}</div>
    </div>`;
  }).join('');
}

function selectDay(ds) {
  selectedDate=ds;
  currentWeekStart=getMonday(new Date(ds));
  renderAll();
}

/* DAY VIEW */
function renderDayView() {
  const view=document.getElementById('day-view');
  view.style.display='flex';
  document.getElementById('week-view').style.display='none';
  const dayEvs=Object.values(events)
    .filter(e=>e.date===selectedDate&&activeMembers.has(e.memberId))
    .sort((a,b)=>a.start.localeCompare(b.start));

  let html='';
  HOURS.forEach(h=>{
    const hStr=String(h).padStart(2,'0')+':00';
    html+=`<div class="hour-row">
      <div class="hour-label">${String(h).padStart(2,'0')}</div>
      <div class="hour-col" onclick="openNewEv('${selectedDate}',${h})"></div>
    </div>`;
  });
  view.innerHTML=html;

  // Place events
  dayEvs.forEach(ev=>{
    const m=members.find(x=>x.id===ev.memberId); if(!m) return;
    const [sh,sm]=ev.start.split(':').map(Number);
    const [eh,em]=ev.end.split(':').map(Number);
    const dur=Math.max(30,(eh*60+em)-(sh*60+sm));
    const rows=view.querySelectorAll('.hour-row');
    const col=rows[sh]?.querySelector('.hour-col'); if(!col) return;
    const b=document.createElement('div');
    b.className='ev-block';
    b.style.cssText=`top:${(sm/52)*100}%;height:${(dur/60)*52-3}px;background:${m.color}`;
    b.innerHTML=`<div class="ev-block-title">${esc(ev.title)}</div>
      <div class="ev-block-person">${esc(m.name)} · ${ev.start}–${ev.end}</div>`;
    b.onclick=e=>{e.stopPropagation();openEditEv(ev.id);};
    col.style.position='relative';
    col.appendChild(b);
  });

  // Scroll to 7am
  const scroll=document.getElementById('cal-scroll');
  const rows=view.querySelectorAll('.hour-row');
  if(rows[7]) setTimeout(()=>{
    scroll.scrollTop=rows[7].offsetTop-60;
  },50);
}

/* WEEK VIEW (desktop) */
function renderWeekView() {
  const view=document.getElementById('week-view');
  view.style.display='block';
  document.getElementById('day-view').style.display='none';
  const days=weekDays();
  const grid=document.createElement('div');
  grid.className='week-grid';

  let html='<div class="wg-corner"></div>';
  days.forEach(d=>{
    const n=isToday(d)?`<div class="wg-dnum-today">${d.getDate()}</div>`:`<div class="wg-dnum">${d.getDate()}</div>`;
    html+=`<div class="wg-dayhdr"><div class="wg-dname">${DAYS_SHORT[d.getDay()]}</div>${n}</div>`;
  });
  HOURS.forEach(h=>{
    html+=`<div class="wg-tlabel">${String(h).padStart(2,'0')}:00</div>`;
    days.forEach(d=>{
      html+=`<div class="wg-hcell" data-date="${isoDate(d)}" data-hour="${h}" onclick="openNewEv('${isoDate(d)}',${h})"></div>`;
    });
  });
  grid.innerHTML=html;
  view.innerHTML='';
  view.appendChild(grid);

  const visible=new Set(days.map(isoDate));
  Object.values(events).forEach(ev=>{
    if(!visible.has(ev.date)) return;
    const m=members.find(x=>x.id===ev.memberId);
    if(!m||!activeMembers.has(ev.memberId)) return;
    const [sh,sm]=ev.start.split(':').map(Number);
    const [eh,em]=ev.end.split(':').map(Number);
    const dur=Math.max(30,(eh*60+em)-(sh*60+sm));
    const cell=grid.querySelector(`[data-date="${ev.date}"][data-hour="${sh}"]`);
    if(!cell) return;
    const b=document.createElement('div');
    b.className='wg-eblock';
    b.style.cssText=`top:${(sm/60)*44}px;height:${(dur/60)*44-3}px;background:${m.color}`;
    b.innerHTML=`<div class="wg-etitle">${esc(ev.title)}</div><div class="wg-eperson">${esc(m.name)}</div>`;
    b.onclick=e=>{e.stopPropagation();openEditEv(ev.id);};
    cell.appendChild(b);
  });

  // Scroll to 7am
  setTimeout(()=>{
    const cell=grid.querySelector('[data-hour="7"]');
    if(cell) document.getElementById('cal-scroll').scrollTop=cell.offsetTop-60;
  },50);
}

/* DRAWER RENDER */
function renderDrawer() {
  document.getElementById('drawer-member-list').innerHTML = members.length===0
    ? '<div style="font-size:13px;color:var(--text3);margin-bottom:8px">Inga personer ännu</div>'
    : members.map(m=>`
        <div class="member-chip ${activeMembers.has(m.id)?'':'inactive'}" onclick="toggleMember(${m.id})">
          <span class="mdot" style="background:${m.color}"></span>
          <span class="mname">${esc(m.name)}</span>
          <button class="mdel" onclick="event.stopPropagation();deleteMember(${m.id})">&#x2715;</button>
        </div>`).join('');
  document.getElementById('swatches').innerHTML=PALETTE.map(c=>`
    <div class="swatch ${c===selectedColor?'sel':''}" style="background:${c}" onclick="selectedColor='${c}';renderDrawer()"></div>`).join('');
}

/* EVENT MODAL */
function openNewEv(dateStr, hour) {
  if(members.length===0){alert('Lägg till minst en person först!');return;}
  editingEvId=null;
  document.getElementById('ev-hdr').innerHTML='Ny händelse <button class="modal-close" onclick="closeEv()">&#x2715;</button>';
  document.getElementById('ev-title').value='';
  document.getElementById('ev-date').value=dateStr||selectedDate;
  document.getElementById('ev-start').value=`${String(hour||9).padStart(2,'0')}:00`;
  document.getElementById('ev-end').value=`${String(Math.min((hour||9)+1,23)).padStart(2,'0')}:00`;
  document.getElementById('ev-note').value='';
  document.getElementById('ev-del-btn').style.display='none';
  fillPersonSel(null);
  document.getElementById('ev-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('ev-title').focus(),100);
}
function openEditEv(id) {
  const ev=events[id]; if(!ev) return;
  editingEvId=id;
  document.getElementById('ev-hdr').innerHTML='Redigera <button class="modal-close" onclick="closeEv()">&#x2715;</button>';
  document.getElementById('ev-title').value=ev.title;
  document.getElementById('ev-date').value=ev.date;
  document.getElementById('ev-start').value=ev.start;
  document.getElementById('ev-end').value=ev.end;
  document.getElementById('ev-note').value=ev.note||'';
  document.getElementById('ev-del-btn').style.display='block';
  fillPersonSel(ev.memberId);
  document.getElementById('ev-overlay').classList.add('open');
}
function fillPersonSel(selId){
  document.getElementById('ev-person').innerHTML=members.map(m=>
    `<option value="${m.id}" ${m.id===selId?'selected':''}>${esc(m.name)}</option>`).join('');
}
function closeEv(){document.getElementById('ev-overlay').classList.remove('open');editingEvId=null;}
function saveEv(){
  const title=document.getElementById('ev-title').value.trim();
  const memberId=parseInt(document.getElementById('ev-person').value);
  const date=document.getElementById('ev-date').value;
  const start=document.getElementById('ev-start').value;
  const end=document.getElementById('ev-end').value;
  const note=document.getElementById('ev-note').value.trim();
  if(!title){document.getElementById('ev-title').focus();return;}
  if(!date||!start||!end){alert('Fyll i datum och tider.');return;}
  if(start>=end){alert('Sluttid måste vara efter starttid.');return;}
  const id=editingEvId||`ev_${Date.now()}`;
  events[id]={id,title,memberId,date,start,end,note};
  push({events}); closeEv();
}
function deleteEv(){
  if(!confirm('Ta bort händelsen?'))return;
  delete events[editingEvId]; push({events}); closeEv();
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* EVENTS */
document.getElementById('pw-input').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
document.getElementById('new-name').addEventListener('keydown',e=>{if(e.key==='Enter')addMember();});
document.getElementById('ev-overlay').addEventListener('click',e=>{if(e.target===document.getElementById('ev-overlay'))closeEv();});
window.addEventListener('resize',()=>renderAll());

initFirebase();
</script>
</body>
