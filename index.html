<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Familjekalender</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --surface2: #f0ede6;
  --text: #1a1a18;
  --text2: #6b6b67;
  --text3: #a0a09a;
  --border: rgba(0,0,0,0.10);
  --border2: rgba(0,0,0,0.18);
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'Segoe UI', system-ui, sans-serif;
  --blue: #185FA5;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #181816;
    --surface: #222220;
    --surface2: #2a2a28;
    --text: #f0ede6;
    --text2: #9a9a94;
    --text3: #5a5a56;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.16);
  }
}

body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── LOGIN ── */
#login-screen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
}
.login-box {
  background: var(--surface);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius);
  padding: 2.5rem 2rem;
  width: 100%; max-width: 360px;
  text-align: center;
}
.login-box h1 { font-size: 22px; font-weight: 500; margin-bottom: 0.4rem; }
.login-box p  { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; }
.login-box input { width: 100%; margin-bottom: 10px; }
.login-box button { width: 100%; }
#login-error { font-size: 13px; color: #A32D2D; margin-top: 8px; min-height: 18px; }
.calendar-icon { font-size: 40px; margin-bottom: 1rem; }

/* ── APP SHELL ── */
#app { display: none; flex-direction: column; min-height: 100vh; }

/* ── TOP BAR ── */
.topbar {
  background: var(--surface);
  border-bottom: 0.5px solid var(--border);
  padding: 0 1.5rem;
  display: flex; align-items: center; gap: 12px;
  height: 56px;
  position: sticky; top: 0; z-index: 50;
}
.topbar h1 { font-size: 16px; font-weight: 500; flex: 1; }
.topbar-nav { display: flex; align-items: center; gap: 6px; }
.nav-btn {
  background: none; border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm); padding: 5px 10px;
  font-size: 13px; cursor: pointer; color: var(--text);
  font-family: var(--font);
}
.nav-btn:hover { background: var(--surface2); }
.week-label { font-size: 14px; font-weight: 500; min-width: 170px; text-align: center; }
.logout-btn {
  background: none; border: none; cursor: pointer;
  font-size: 13px; color: var(--text2); font-family: var(--font);
  padding: 5px 8px; border-radius: var(--radius-sm);
}
.logout-btn:hover { background: var(--surface2); }

/* ── MAIN ── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 220px; flex-shrink: 0;
  background: var(--surface);
  border-right: 0.5px solid var(--border);
  padding: 1.25rem 1rem;
  overflow-y: auto;
}
.sidebar h2 { font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }

.member-list { margin-bottom: 1.5rem; }
.member-chip {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; border-radius: var(--radius-sm);
  margin-bottom: 4px; cursor: pointer;
  transition: background .1s;
}
.member-chip:hover { background: var(--surface2); }
.member-chip.inactive { opacity: 0.4; }
.member-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.member-name { font-size: 14px; flex: 1; }
.member-del { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 16px; padding: 0 2px; line-height: 1; }
.member-del:hover { color: #A32D2D; }

.add-member { display: flex; gap: 6px; margin-bottom: 1.5rem; }
.add-member input { flex: 1; font-size: 13px; padding: 6px 8px; }
.add-member button { font-size: 13px; padding: 6px 10px; }

.color-swatches { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem; }
.swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: transform .1s; }
.swatch:hover { transform: scale(1.15); }
.swatch.selected { border-color: var(--text); }

.sidebar-section { margin-bottom: 1.25rem; }
.legend { display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ── CALENDAR ── */
.cal-wrap { flex: 1; overflow: auto; padding: 1.25rem; }

.week-grid {
  display: grid;
  grid-template-columns: 52px repeat(7, 1fr);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
  min-width: 600px;
}

.cal-header-corner { background: var(--surface2); border-bottom: 0.5px solid var(--border); border-right: 0.5px solid var(--border); }

.day-header {
  background: var(--surface2);
  border-bottom: 0.5px solid var(--border);
  border-right: 0.5px solid var(--border);
  padding: 10px 6px;
  text-align: center;
}
.day-header:last-child { border-right: none; }
.day-name { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .05em; }
.day-num  { font-size: 20px; font-weight: 500; margin-top: 2px; }
.day-num.today {
  background: var(--blue);
  color: #fff;
  border-radius: 50%;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  margin: 2px auto 0;
}

.time-label {
  font-size: 11px; color: var(--text3);
  padding: 0 6px;
  height: 48px;
  display: flex; align-items: flex-start; justify-content: flex-end;
  padding-top: 4px;
  border-bottom: 0.5px solid var(--border);
  border-right: 0.5px solid var(--border);
}

.day-col {
  border-right: 0.5px solid var(--border);
  position: relative;
}
.day-col:last-child { border-right: none; }

.hour-cell {
  height: 48px;
  border-bottom: 0.5px solid var(--border);
  cursor: pointer;
  transition: background .1s;
}
.hour-cell:hover { background: var(--surface2); }
.hour-cell:last-child { border-bottom: none; }

.event-block {
  position: absolute;
  left: 2px; right: 2px;
  border-radius: var(--radius-sm);
  padding: 3px 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  overflow: hidden;
  z-index: 2;
  line-height: 1.3;
  transition: opacity .1s;
}
.event-block:hover { opacity: 0.85; }
.event-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-person { font-size: 10px; font-weight: 400; opacity: 0.85; }

/* ── MODAL ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.4); z-index: 200;
  align-items: center; justify-content: center; padding: 1rem;
}
.overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius);
  padding: 1.5rem; width: 100%; max-width: 420px;
}
.modal h2 { font-size: 16px; font-weight: 500; margin-bottom: 1.25rem; display: flex; justify-content: space-between; align-items: center; }
.close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text2); line-height: 1; }
.field { margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
.field input, .field select, .field textarea { width: 100%; }
.field textarea { min-height: 60px; resize: vertical; }
.time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 8px; justify-content: space-between; margin-top: 1.25rem; padding-top: 1.25rem; border-top: 0.5px solid var(--border); }

/* ── SHARED INPUTS ── */
input, select, textarea, button {
  font-family: var(--font);
  font-size: 14px;
  color: var(--text);
  background: var(--surface2);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(24,95,165,0.15);
}
button {
  cursor: pointer;
  background: var(--surface);
  transition: background .1s, transform .1s;
}
button:hover { background: var(--surface2); }
button:active { transform: scale(0.98); }
button.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
button.primary:hover { background: #0C447C; border-color: #0C447C; }
button.danger { background: #FCEBEB; color: #791F1F; border-color: #F09595; }
button.danger:hover { background: #F7C1C1; }

/* ── SETTINGS MODAL ── */
.settings-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.settings-row label { font-size: 13px; flex: 1; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="calendar-icon">📅</div>
    <h1>Familjekalender</h1>
    <p>Ange lösenordet för att fortsätta</p>
    <input type="password" id="pw-input" placeholder="Lösenord" />
    <button class="primary" onclick="tryLogin()">Logga in</button>
    <div id="login-error"></div>
    <p style="font-size:11px;color:var(--text3);margin-top:1.5rem">Standard lösenord: <strong>familj123</strong><br>Ändra i inställningar efter inloggning.</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <!-- TOPBAR -->
  <div class="topbar">
    <h1>📅 Familjekalender</h1>
    <div class="topbar-nav">
      <button class="nav-btn" onclick="prevWeek()">&#8592;</button>
      <span class="week-label" id="week-label"></span>
      <button class="nav-btn" onclick="nextWeek()">&#8594;</button>
      <button class="nav-btn" onclick="goToday()">Idag</button>
    </div>
    <button class="nav-btn" onclick="openSettings()" title="Inställningar">⚙ Inställningar</button>
    <button class="logout-btn" onclick="logout()">Logga ut</button>
  </div>

  <div class="main">
    <!-- SIDEBAR -->
    <div class="sidebar">
      <h2>Familjemedlemmar</h2>
      <div class="member-list" id="member-list"></div>

      <div style="font-size:12px;color:var(--text2);margin-bottom:6px">Ny person</div>
      <div class="add-member">
        <input type="text" id="new-member-name" placeholder="Namn" maxlength="20" />
        <button onclick="addMember()" title="Lägg till">+</button>
      </div>

      <div style="font-size:12px;color:var(--text2);margin-bottom:6px">Välj färg</div>
      <div class="color-swatches" id="color-swatches"></div>

      <div class="sidebar-section">
        <h2 style="margin-bottom:8px">Förklaring</h2>
        <div class="legend" id="legend"></div>
      </div>
    </div>

    <!-- CALENDAR -->
    <div class="cal-wrap">
      <div class="week-grid" id="week-grid"></div>
    </div>
  </div>
</div>

<!-- EVENT MODAL -->
<div class="overlay" id="event-overlay">
  <div class="modal">
    <h2 id="event-modal-title">Ny händelse <button class="close-btn" onclick="closeEventModal()">&#x2715;</button></h2>
    <div class="field"><label>Titel</label><input type="text" id="ev-title" placeholder="t.ex. Fotbollsträning" /></div>
    <div class="field"><label>Person</label><select id="ev-person"></select></div>
    <div class="field"><label>Datum</label><input type="date" id="ev-date" /></div>
    <div class="time-row">
      <div class="field"><label>Starttid</label><input type="time" id="ev-start" /></div>
      <div class="field"><label>Sluttid</label><input type="time" id="ev-end" /></div>
    </div>
    <div class="field"><label>Anteckning (valfritt)</label><textarea id="ev-note" placeholder="Mer info..."></textarea></div>
    <div class="modal-actions">
      <button class="danger" id="ev-delete-btn" onclick="deleteEvent()">Ta bort</button>
      <div style="display:flex;gap:8px">
        <button onclick="closeEventModal()">Avbryt</button>
        <button class="primary" onclick="saveEvent()">Spara</button>
      </div>
    </div>
  </div>
</div>

<!-- SETTINGS MODAL -->
<div class="overlay" id="settings-overlay">
  <div class="modal">
    <h2>Inställningar <button class="close-btn" onclick="closeSettings()">&#x2715;</button></h2>
    <div class="field">
      <label>Nytt lösenord</label>
      <input type="password" id="new-pw" placeholder="Lämna tomt för att behålla" />
    </div>
    <div class="field">
      <label>Bekräfta nytt lösenord</label>
      <input type="password" id="new-pw2" placeholder="" />
    </div>
    <div id="pw-msg" style="font-size:13px;min-height:18px;margin-bottom:8px"></div>
    <div class="modal-actions">
      <div></div>
      <div style="display:flex;gap:8px">
        <button onclick="closeSettings()">Stäng</button>
        <button class="primary" onclick="saveSettings()">Spara lösenord</button>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE = 'familjekalender_v1';
const PALETTE = [
  '#E05A5A','#E07B2A','#D4AC0D','#4CAF50','#2196F3',
  '#9C27B0','#00BCD4','#FF5BA3','#3B8F5A','#5C6BC0'
];
const DAYS_SV = ['Sön','Mån','Tis','Ons','Tor','Fre','Lör'];
const HOURS = Array.from({length:24},(_,i)=>i);

let state = {
  password: 'familj123',
  members: [],
  events: [],
  nextMemberId: 1,
  nextEventId: 1,
};
let currentWeekStart = getMonday(new Date());
let selectedColor = PALETTE[0];
let editingEventId = null;
let prefillDate = null;
let prefillHour = null;
let activeMembers = new Set();

/* ── PERSIST ── */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE);
    if (raw) state = JSON.parse(raw);
    activeMembers = new Set(state.members.map(m => m.id));
  } catch(e) {}
}
function saveState() {
  localStorage.setItem(STORAGE, JSON.stringify(state));
}

/* ── AUTH ── */
function tryLogin() {
  const val = document.getElementById('pw-input').value;
  if (val === state.password) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('pw-input').value = '';
    document.getElementById('login-error').textContent = '';
    renderAll();
  } else {
    document.getElementById('login-error').textContent = 'Fel lösenord. Försök igen.';
  }
}
function logout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

/* ── SETTINGS ── */
function openSettings() { document.getElementById('settings-overlay').classList.add('open'); }
function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
  document.getElementById('new-pw').value = '';
  document.getElementById('new-pw2').value = '';
  document.getElementById('pw-msg').textContent = '';
}
function saveSettings() {
  const p1 = document.getElementById('new-pw').value;
  const p2 = document.getElementById('new-pw2').value;
  const msg = document.getElementById('pw-msg');
  if (!p1) { msg.style.color='#A32D2D'; msg.textContent = 'Ange ett nytt lösenord.'; return; }
  if (p1 !== p2) { msg.style.color='#A32D2D'; msg.textContent = 'Lösenorden matchar inte.'; return; }
  if (p1.length < 4) { msg.style.color='#A32D2D'; msg.textContent = 'Minst 4 tecken krävs.'; return; }
  state.password = p1;
  saveState();
  msg.style.color = '#3B6D11';
  msg.textContent = 'Lösenordet har sparats!';
  setTimeout(closeSettings, 1200);
}

/* ── MEMBERS ── */
function addMember() {
  const name = document.getElementById('new-member-name').value.trim();
  if (!name) return;
  const usedColors = state.members.map(m => m.color);
  const freeColor = PALETTE.find(c => !usedColors.includes(c)) || selectedColor;
  const member = { id: state.nextMemberId++, name, color: freeColor };
  state.members.push(member);
  activeMembers.add(member.id);
  document.getElementById('new-member-name').value = '';
  saveState();
  renderAll();
}
function deleteMember(id) {
  if (!confirm('Ta bort person och alla deras händelser?')) return;
  state.members = state.members.filter(m => m.id !== id);
  state.events  = state.events.filter(e => e.memberId !== id);
  activeMembers.delete(id);
  saveState();
  renderAll();
}
function toggleMember(id) {
  if (activeMembers.has(id)) activeMembers.delete(id);
  else activeMembers.add(id);
  renderSidebar();
  renderCalendar();
}

/* ── WEEK NAVIGATION ── */
function getMonday(d) {
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function prevWeek() { currentWeekStart.setDate(currentWeekStart.getDate()-7); renderCalendar(); }
function nextWeek() { currentWeekStart.setDate(currentWeekStart.getDate()+7); renderCalendar(); }
function goToday()  { currentWeekStart = getMonday(new Date()); renderCalendar(); }

function weekDays() {
  return Array.from({length:7}, (_,i) => {
    const d = new Date(currentWeekStart);
    d.setDate(d.getDate()+i);
    return d;
  });
}

function fmtDate(d) {
  return d.toLocaleDateString('sv-SE', {weekday:'short', day:'numeric', month:'short'});
}
function isoDate(d) {
  return d.toISOString().slice(0,10);
}
function isToday(d) {
  const t = new Date();
  return d.getFullYear()===t.getFullYear() && d.getMonth()===t.getMonth() && d.getDate()===t.getDate();
}

/* ── RENDER ALL ── */
function renderAll() { renderSidebar(); renderCalendar(); }

/* ── SIDEBAR ── */
function renderSidebar() {
  // member list
  const ml = document.getElementById('member-list');
  if (state.members.length === 0) {
    ml.innerHTML = '<div style="font-size:13px;color:var(--text3);margin-bottom:12px">Inga personer ännu</div>';
  } else {
    ml.innerHTML = state.members.map(m => `
      <div class="member-chip ${activeMembers.has(m.id)?'':'inactive'}" onclick="toggleMember(${m.id})">
        <span class="member-dot" style="background:${m.color}"></span>
        <span class="member-name">${esc(m.name)}</span>
        <button class="member-del" onclick="event.stopPropagation();deleteMember(${m.id})" title="Ta bort">&#x2715;</button>
      </div>`).join('');
  }
  // color swatches
  const cs = document.getElementById('color-swatches');
  cs.innerHTML = PALETTE.map(c => `
    <div class="swatch ${c===selectedColor?'selected':''}" style="background:${c}" onclick="selectColor('${c}')"></div>`).join('');
  // legend
  const lg = document.getElementById('legend');
  lg.innerHTML = state.members.length === 0
    ? '<div style="font-size:13px;color:var(--text3)">Lägg till personer för att se förklaring</div>'
    : state.members.map(m => `
      <div class="legend-item">
        <span class="legend-dot" style="background:${m.color}"></span>
        ${esc(m.name)}
      </div>`).join('');
}

function selectColor(c) {
  selectedColor = c;
  // also update last-selected member if editing
  renderSidebar();
}

/* ── CALENDAR ── */
function renderCalendar() {
  const days = weekDays();
  const grid = document.getElementById('week-grid');

  // week label
  const first = days[0], last = days[6];
  document.getElementById('week-label').textContent =
    `${first.getDate()} ${first.toLocaleDateString('sv-SE',{month:'short'})} – ${last.getDate()} ${last.toLocaleDateString('sv-SE',{month:'long', year:'numeric'})}`;

  let html = '';
  // corner
  html += '<div class="cal-header-corner"></div>';
  // day headers
  days.forEach(d => {
    const numHtml = isToday(d)
      ? `<div class="day-num today">${d.getDate()}</div>`
      : `<div class="day-num">${d.getDate()}</div>`;
    html += `<div class="day-header"><div class="day-name">${DAYS_SV[d.getDay()]}</div>${numHtml}</div>`;
  });

  // hours
  HOURS.forEach(h => {
    html += `<div class="time-label">${String(h).padStart(2,'0')}:00</div>`;
    days.forEach(d => {
      const dateStr = isoDate(d);
      html += `<div class="day-col hour-cell" onclick="openNewEvent('${dateStr}',${h})" data-date="${dateStr}" data-hour="${h}"></div>`;
    });
  });

  grid.innerHTML = html;

  // place events
  const visibleDates = new Set(days.map(isoDate));
  state.events.forEach(ev => {
    if (!visibleDates.has(ev.date)) return;
    const member = state.members.find(m => m.id === ev.memberId);
    if (!member) return;
    if (!activeMembers.has(ev.memberId)) return;

    const [sh, sm] = ev.start.split(':').map(Number);
    const [eh, em] = ev.end.split(':').map(Number);
    const startMin = sh*60+sm, endMin = eh*60+em;
    const durMin = Math.max(30, endMin - startMin);

    const top = (startMin / 60) * 48;
    const height = (durMin / 60) * 48 - 3;

    // find the day column index
    const dayIdx = days.findIndex(d => isoDate(d) === ev.date);
    // columns: 1 corner + 7 days; each hour-row has 1 time-label + 7 day-cols
    // We need to find the cell at row h=sh, col=dayIdx
    const cells = grid.querySelectorAll(`.day-col[data-date="${ev.date}"][data-hour="${sh}"]`);
    if (cells.length === 0) return;
    const cell = cells[0];

    // get cell position relative to grid
    const cellRect = cell.getBoundingClientRect();
    const gridRect = grid.getBoundingClientRect();

    const block = document.createElement('div');
    block.className = 'event-block';
    block.style.cssText = `
      top: ${top}px;
      height: ${height}px;
      background: ${member.color};
      color: #fff;
    `;
    block.innerHTML = `<div class="event-title">${esc(ev.title)}</div><div class="event-person">${esc(member.name)}</div>`;
    block.onclick = (e) => { e.stopPropagation(); openEditEvent(ev.id); };

    // position relative to the day column
    const dayCol = grid.querySelector(`[data-date="${ev.date}"]`);
    if (dayCol) {
      const wrapper = document.createElement('div');
      wrapper.style.cssText = `position:relative; grid-column:${dayIdx+2}; grid-row:${sh+2}`;
      block.style.position = 'absolute';
      block.style.left = '2px';
      block.style.right = '2px';
      block.style.top = `${(sm/60)*48}px`;
      cell.style.position = 'relative';
      cell.appendChild(block);
    }
  });
}

/* ── EVENT MODAL ── */
function openNewEvent(dateStr, hour) {
  if (state.members.length === 0) { alert('Lägg till minst en person i sidopanelen först!'); return; }
  editingEventId = null;
  prefillDate = dateStr;
  prefillHour = hour;
  document.getElementById('event-modal-title').innerHTML = 'Ny händelse <button class="close-btn" onclick="closeEventModal()">&#x2715;</button>';
  document.getElementById('ev-title').value = '';
  document.getElementById('ev-date').value = dateStr;
  document.getElementById('ev-start').value = `${String(hour).padStart(2,'0')}:00`;
  document.getElementById('ev-end').value   = `${String(Math.min(hour+1,23)).padStart(2,'0')}:00`;
  document.getElementById('ev-note').value  = '';
  document.getElementById('ev-delete-btn').style.display = 'none';
  populatePersonSelect(null);
  document.getElementById('event-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('ev-title').focus(),100);
}

function openEditEvent(id) {
  const ev = state.events.find(e => e.id === id);
  if (!ev) return;
  editingEventId = id;
  document.getElementById('event-modal-title').innerHTML = 'Redigera händelse <button class="close-btn" onclick="closeEventModal()">&#x2715;</button>';
  document.getElementById('ev-title').value = ev.title;
  document.getElementById('ev-date').value  = ev.date;
  document.getElementById('ev-start').value = ev.start;
  document.getElementById('ev-end').value   = ev.end;
  document.getElementById('ev-note').value  = ev.note || '';
  document.getElementById('ev-delete-btn').style.display = 'block';
  populatePersonSelect(ev.memberId);
  document.getElementById('event-overlay').classList.add('open');
}

function populatePersonSelect(selectedId) {
  const sel = document.getElementById('ev-person');
  sel.innerHTML = state.members.map(m =>
    `<option value="${m.id}" ${m.id===selectedId?'selected':''}>${esc(m.name)}</option>`
  ).join('');
}

function closeEventModal() { document.getElementById('event-overlay').classList.remove('open'); editingEventId = null; }

function saveEvent() {
  const title = document.getElementById('ev-title').value.trim();
  const memberId = parseInt(document.getElementById('ev-person').value);
  const date  = document.getElementById('ev-date').value;
  const start = document.getElementById('ev-start').value;
  const end   = document.getElementById('ev-end').value;
  const note  = document.getElementById('ev-note').value.trim();
  if (!title) { document.getElementById('ev-title').focus(); return; }
  if (!date || !start || !end) { alert('Fyll i datum och tider.'); return; }
  if (start >= end) { alert('Sluttid måste vara efter starttid.'); return; }

  if (editingEventId !== null) {
    const ev = state.events.find(e => e.id === editingEventId);
    if (ev) Object.assign(ev, { title, memberId, date, start, end, note });
  } else {
    state.events.push({ id: state.nextEventId++, title, memberId, date, start, end, note });
  }
  saveState();
  closeEventModal();
  renderCalendar();
}

function deleteEvent() {
  if (!confirm('Ta bort händelsen?')) return;
  state.events = state.events.filter(e => e.id !== editingEventId);
  saveState();
  closeEventModal();
  renderCalendar();
}

/* ── UTILS ── */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── INIT ── */
document.getElementById('pw-input').addEventListener('keydown', e => { if (e.key==='Enter') tryLogin(); });
document.getElementById('new-member-name').addEventListener('keydown', e => { if (e.key==='Enter') addMember(); });
document.getElementById('event-overlay').addEventListener('click', e => { if (e.target===document.getElementById('event-overlay')) closeEventModal(); });
document.getElementById('settings-overlay').addEventListener('click', e => { if (e.target===document.getElementById('settings-overlay')) closeSettings(); });
document.addEventListener('keydown', e => { if (e.key==='Escape') { closeEventModal(); closeSettings(); } });

loadState();
// If no members, add example members
if (state.members.length === 0) {
  ['Mamma','Pappa','Ella','Noah'].forEach((name,i) => {
    state.members.push({ id: state.nextMemberId++, name, color: PALETTE[i] });
  });
  activeMembers = new Set(state.members.map(m => m.id));
  saveState();
}
</script>
